<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <rect width="800" height="1000" fill="#fdfbf7" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Notebook lines -->
  <line x1="120" y1="0" x2="120" y2="1000" stroke="#fca5a5" stroke-width="2" />
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="800" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="440" x2="800" y2="440" />
    <line x1="0" y1="480" x2="800" y2="480" />
    <line x1="0" y1="520" x2="800" y2="520" />
    <line x1="0" y1="560" x2="800" y2="560" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="640" x2="800" y2="640" />
    <line x1="0" y1="680" x2="800" y2="680" />
    <line x1="0" y1="720" x2="800" y2="720" />
    <line x1="0" y1="760" x2="800" y2="760" />
  </g>
  <!-- Handwriting simulation -->
  <text x="140" y="110" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e293b">საშინაო დავალება N1 - მათემატიკა</text>
  <text x="140" y="150" font-family="sans-serif" font-size="16" fill="#334155">1) ax² + bx + c = 0</text>
  <text x="140" y="190" font-family="sans-serif" font-size="16" fill="#334155">   D = b² - 4ac = (-5)² - 4·1·6 = 25 - 24 = 1</text>
  <text x="140" y="230" font-family="sans-serif" font-size="16" fill="#334155">   x₁ = (5 + 1) / 2 = 3</text>
  <text x="140" y="270" font-family="sans-serif" font-size="16" fill="#334155">   x₂ = (5 - 1) / 2 = 2</text>
  <text x="140" y="310" font-family="sans-serif" font-size="16" fill="#16a34a">   პასუხი: x₁ = 3, x₂ = 2  ✓</text>
  <text x="140" y="390" font-family="sans-serif" font-size="16" fill="#334155">2) 2x² - 8x = 0</text>
  <text x="140" y="430" font-family="sans-serif" font-size="16" fill="#334155">   2x(x - 4) = 0 =&gt; x = 0 ან x = 4</text>
  <text x="140" y="470" font-family="sans-serif" font-size="16" fill="#16a34a">   პასუხი: x₁ = 0, x₂ = 4  ✓</text>
</svg>

